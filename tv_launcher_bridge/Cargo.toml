[package]
name = "tv-launcher-bridge"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:image"]

[[bin]]
name = "tv-launcher-bridge"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "tv-bridge-addon"
path = "src/addon.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.23.1"
curve25519-dalek = "4"
eframe = { optional = true, version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
hkdf = "0.12"
image = { optional = true, version = "0.25.10", default-features = false, features = ["png"] }
rand = "0.8"
rsa = "0.9.10"
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-rustcrypto = "0.0.2-alpha"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
socket2 = { version = "0.5", features = ["all"] }
tiny_http = "0.12.0"
ureq = { version = "3.5.0", default-features = false }

[profile.dev.package."*"]
opt-level = 2
